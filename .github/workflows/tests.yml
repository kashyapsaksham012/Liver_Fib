name: tests

on:
  push:
    paths:
      - "liver_fibrosis_research/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "liver_fibrosis_research/**"
      - ".github/workflows/tests.yml"

jobs:
  validation-suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: liver_fibrosis_research
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-phase3-lock.txt

      - name: Run validation scripts
        # Project convention (see tests/README.md): standalone scripts, not pytest.
        # Each prints "N passed, M failed" and exits non-zero on any failure.
        run: |
          status=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t" || status=1
            echo "::endgroup::"
          done
          exit $status
